# The following `args-*` fields are not part of tmuxinator, but they are used to perform
# some kind of input validation and/or inject default settings.
# 
# Available input arguments are:
#
# - `branch` git branch to be reviewed (default: 'main')
# - `v` vertical layout. Set it equal to anything (e.g. `v=true`) to switch from
#       an horizontal to a vertical layout. 
# - `path` path, relative to home (~) directory, to use as cwd
# - `task` task to run automatically after startup
args-branch: "<% @settings['branch'] ||= 'main' %>"
args-layout: "<% @settings['layout'] = @settings['v'] ? 'vertical' : 'horizontal' %>"
args-path: "<% @settings['path'] ||= '' %>"
args-task: "<% @settings['task'] ||= 'clear' %>"


name: review
root: ~/<%= @settings["path"] %>

# Optional tmux socket
# socket_name: foo

# Note that the pre and post options have been deprecated and will be replaced by
# project hooks.

# Project hooks

# Runs on project start, always
# on_project_start: command

# Run on project start, the first time
# on_project_first_start: command

# Run on project start, after the first time
# on_project_restart: command

# Run on project exit ( detaching from tmux session )
# on_project_exit: command

# Run on project stop
# on_project_stop: command

# Runs in each window and pane before window/pane specific commands. Useful for setting up interpreter versions.
# pre_window: rbenv shell 2.0.0-p247

# Pass command line options to tmux. Useful for specifying a different tmux.conf.
# tmux_options: -f ~/.tmux.mac.conf

# Change the command to call tmux. This can be used by derivatives/wrappers like byobu.
# tmux_command: byobu

# Specifies (by name or index) which window will be selected on project startup. If not set, the first window is used.
# startup_window: editor

# Specifies (by index) which pane of the specified window will be selected on project startup. If not set, the first pane is used.
# startup_pane: 1

# Controls whether the tmux session should be attached to automatically. Defaults to true.
# attach: false

windows:
  - editor:
      layout: 'main-<%= @settings["layout"] %>'
      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      panes:
        - ~:
          - echo 'reviewing branch <%= @settings["branch"] %>'

          - git fetch --prune

          - >
            (git checkout main && git pull) ||
            tmux set-environment ERROR_MSG "failed to checkout to main"

          - >
            (git checkout <%= @settings["branch"] %> && git pull) ||
            tmux set-environment ERROR_MSG "failed to checkout to <%= @settings["branch"] %>"

          - tmux wait -S ready
          - eval $(tmux show-environment -s) # reload tmux env variables

          # start nvim
          - if [ -z "$ERROR_MSG" ]; then clear; nvim .; fi

          # log error
          - if [ -n "$ERROR_MSG" ]; then echo "\e[31m[ERROR] $ERROR_MSG\e[0m"; fi

        # - ~:
        #   - tmux wait ready
        #   - yarn
        #   - tmux resize-pane -t 2 -y 15%
        #   - clear
  - tasks:  
      layout: 'main-<%= @settings["layout"] %>'
      panes:
        - ~:
          - tmux wait ready
          - eval $(tmux show-environment -s) # reload tmux env variables

          # install
          - if [ -z "$ERROR_MSG" ]; then yarn; clear; fi

          # run provided task
          - if [ -z "$ERROR_MSG" ]; then <%= @settings["task"] %>; fi

          # log error
          - if [ -n "$ERROR_MSG" ]; then echo "\e[31m[ERROR] $ERROR_MSG\e[0m"; fi
